<body>

  <!-- ========== Header ========== -->
  <header class="header">
    <div class="header__container">
      <a href="../index.html" class="header__logo">
        <img src="../images/icon/DR.png" alt="Dalox Logo" class="header__logo-img">
        DALOX
      </a>
      <nav class="header__nav">
        <a href="../subpage/generator.html" class="header__link">Generator</a>
        <a href="../subpage/image-analyzer.html" class="header__link header__link--active">Image Analyzer</a>
        <a href="../subpage/color-library.html" class="header__link">Color Spectrum</a>
        <a href="../subpage/color-combinations.html" class="header__link">Color Combinations</a>
        <a href="../subpage/ui-preview.html" class="header__link">UI Preview</a>
      </nav>
      <button class="header__menu-toggle" aria-label="Menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>

  <!-- ========== Mobile Menu ========== -->
  <div class="mobile-menu">
    <nav class="mobile-menu__nav">
      <a href="../subpage/generator.html" class="mobile-menu__link">Generator</a>
      <a href="../subpage/image-analyzer.html" class="mobile-menu__link">Image Analyzer</a>
      <a href="../subpage/color-library.html" class="mobile-menu__link">Color Spectrum</a>
      <a href="../subpage/color-combinations.html" class="mobile-menu__link">Color Combinations</a>
      <a href="../subpage/ui-preview.html" class="mobile-menu__link">UI Preview</a>
    </nav>
  </div>

  <!-- ========== Main ========== -->
  <main class="analyzer">
    <div class="analyzer__container">
      <div class="page-top">
        <div class="page-top__content">
          <!-- Page Header -->
          <div class="analyzer__header">
            <h1 class="analyzer__title">Image Analyzer</h1>
            <p class="analyzer__subtitle">Upload an image to extract its color palette</p>
          </div>
        </div>
        <aside class="page-ad page-ad-right page-ad-right--analyzer">
          <ins class="kakao_ad_area" style="display:none;" data-ad-unit = "DAN-qGwkuxRgX5ox0gaP" data-ad-width = "300" data-ad-height = "250"></ins>
          <script type="text/javascript" src="//t1.kakaocdn.net/kas/static/ba.min.js" async></script>
        </aside>
      </div>

      <!-- Upload Area -->
      <div class="upload-area" id="uploadArea">
        <input type="file" id="fileInput" accept="image/*" hidden>
        <div class="upload-area__content">
          <svg class="upload-area__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          <p class="upload-area__text">Drop image here or click to upload</p>
          <p class="upload-area__hint">Supports JPG, PNG, WebP</p>
        </div>
      </div>

      <!-- Image Preview -->
      <div class="image-preview" id="imagePreview" hidden>
        <img id="previewImage" src="" alt="Uploaded image">
        <button class="image-preview__remove" id="removeBtn">Remove</button>
      </div>

      <!-- Controls -->
      <div class="controls" id="controls" hidden>
        <div class="controls__slider">
          <label class="controls__label" for="colorCount">Color Count: <span id="colorCountValue">10</span></label>
          <input type="range" id="colorCount" min="5" max="20" value="10">
          <div class="controls__slider-labels">
            <span>5</span>
            <span>20</span>
          </div>
        </div>
        <button class="controls__extract-btn" id="extractBtn">Extract Colors</button>
      </div>

      <!-- Color Palette -->
      <div class="palette" id="palette" hidden>
        <h2 class="palette__title">Extracted Palette</h2>
        <div class="palette__grid" id="paletteGrid"></div>
      </div>

    </div>
  </main>

  <!-- JavaScript -->
  <script src="../js/image-analyzer.js"></script>
  <script src="../js/legal-modal.js"></script>

  <!-- ========== Footer Ad ========== -->
  <section class="footer-ad">
    <ins class="kakao_ad_area" style="display:none;" data-ad-unit = "DAN-QYOWmBQro1NHoXYp" data-ad-width = "728" data-ad-height = "90"></ins>
    <script type="text/javascript" src="//t1.kakaocdn.net/kas/static/ba.min.js" async></script>
  </section>

  <!-- Mobile Kakao Ad -->

    data-ad-unit = "DAN-i9C7LR48GvH7CioF"
    data-ad-width = "320"
    data-ad-height = "480"></ins>
    <script type="text/javascript" src="//t1.kakaocdn.net/kas/static/ba.min.js" async></script>
  </div>
